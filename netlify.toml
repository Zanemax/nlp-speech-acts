# Netlify configuration for AUSTIN BOT: a static React app plus one serverless
# function that proxies Gemini so the API key stays server-side.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve the app for every path; /api/generate is routed by the function's own config.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
